[defaults]
inventory             = inventory/hosts.ini
interpreter_python    = auto_silent
host_key_checking     = False
retry_files_enabled   = False
display_skipped_hosts = False

# Output dạng YAML cho dễ đọc.
# LƯU Ý: đừng viết `stdout_callback = yaml` — plugin community.general.yaml đã bị
# gỡ bỏ từ community.general 12. Cách đúng với ansible-core hiện đại là để
# stdout_callback mặc định rồi đổi định dạng kết quả bằng option dưới đây.
callback_result_format = yaml

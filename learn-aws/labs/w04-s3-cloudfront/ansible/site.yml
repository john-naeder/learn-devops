---
# ===========================================================================
# TUẦN 4 — Ansible làm vòng đời NỘI DUNG, Terraform làm hạ tầng
#
# Ranh giới ở đây rất rõ và rất thực tế:
#   Terraform  bucket, distribution, OAC, lifecycle, bucket policy   (hiếm khi đổi)
#   Ansible    đẩy nội dung mới, invalidate cache, cấp presigned URL (đổi mỗi ngày)
#
# Đây đúng là cách các đội làm thật: hạ tầng dựng một lần, còn deploy nội dung
# thì chạy hàng chục lần mỗi tuần. Đưa việc deploy vào Terraform là sai công cụ.
#
# Chạy:
#   ansible-playbook site.yml                     # deploy + invalidate
#   ansible-playbook site.yml --tags deploy
#   ansible-playbook site.yml --tags versioning   # bài versioning/delete marker
#   ansible-playbook site.yml --tags presigned    # cấp URL có hạn
# ===========================================================================

- name: "Tuần 4 — deploy nội dung và vận hành CloudFront"
  hosts: local
  gather_facts: true

  vars:
    aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('learn', true) }}"
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
    tf_dir: "{{ playbook_dir }}/../terraform"
    site_dir: "{{ playbook_dir }}/../site"
    presigned_ttl: 300 # giây

  tasks:

    - name: Đọc output của Terraform
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ tf_dir }}"
      register: tf_raw
      changed_when: false

    - name: Chuyển thành biến phẳng
      ansible.builtin.set_fact:
        tf: >-
          {{ dict(parsed | dict2items | map(attribute='key') | list
                | zip(parsed | dict2items | map(attribute='value.value') | list)) }}
      vars:
        parsed: "{{ tf_raw.stdout | from_json }}"

    - name: Hạ tầng đang có
      ansible.builtin.debug:
        msg:
          - "Bucket      : {{ tf.bucket_name }}"
          - "CloudFront  : {{ tf.cloudfront_url }}"
          - "Distribution: {{ tf.distribution_id }}"
          - "Bucket phụ  : {{ tf.replica_bucket | default('không có (CRR đang tắt — tốt)') }}"

    # ==================================================================== DEPLOY
    - name: Đẩy nội dung site lên S3
      # s3_sync chỉ upload file đã đổi (so sánh checksum), giống `aws s3 sync`.
      # mime_map để trình duyệt hiển thị thay vì tải file về.
      # Lưu ý FQCN: s3_sync nằm ở community.aws, KHÔNG phải amazon.aws.
      # Các module S3 bị chia đôi giữa hai collection — s3_bucket/s3_object ở
      # amazon.aws, còn s3_sync/s3_lifecycle/s3_website ở community.aws.
      community.aws.s3_sync:
        bucket: "{{ tf.bucket_name }}"
        file_root: "{{ site_dir }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        delete: false
        mime_map:
          .html: text/html
          .css: text/css
          .js: application/javascript
          .txt: text/plain
      register: dong_bo
      tags: [deploy]

    - name: Kết quả đồng bộ
      ansible.builtin.debug:
        msg: "{{ dong_bo.uploads | default([]) | length }} file được cập nhật"
      tags: [deploy]

    # ============================================================== INVALIDATION
    #
    # CloudFront cache ở edge. Đẩy file mới lên S3 KHÔNG tự động cập nhật cache —
    # người dùng vẫn nhận bản cũ cho tới khi TTL hết hạn.
    #
    # Hai cách xử lý, và biết chọn cái nào là kiến thức thi:
    #   1. Invalidation — xoá cache ngay. 1000 path/tháng miễn phí, sau đó
    #      $0,005/path. Đắt nếu lạm dụng.
    #   2. Đổi tên file (versioned filename, ví dụ app.a3f9c2.js) — MIỄN PHÍ,
    #      và là cách các đội chuyên nghiệp làm. URL mới thì không có cache cũ.
    #
    # Ở đây dùng invalidation vì file có tên cố định, nhưng hãy nhớ cách 2.

    - name: Xoá cache CloudFront cho các file vừa đổi
      ansible.builtin.command:
        argv:
          - aws
          - cloudfront
          - create-invalidation
          - "--profile={{ aws_profile }}"
          - "--distribution-id={{ tf.distribution_id }}"
          - "--paths=/index.html"
          - /version.txt
          - /
          - --query=Invalidation.Id
          - --output=text
      register: inval
      changed_when: true
      tags: [deploy]

    - name: Nhắc về chi phí invalidation
      ansible.builtin.debug:
        msg:
          - "Invalidation {{ inval.stdout | trim }} đã tạo (mất 1-3 phút)."
          - "Đã dùng 3 path. Hạn mức miễn phí: 1000 path/tháng, sau đó $0,005/path."
          - "Cách miễn phí và tốt hơn cho production: đặt tên file có hash"
          - "  app.js → app.a3f9c2.js  → URL mới thì không cần xoá cache cũ."
      tags: [deploy]

    # ================================================================ VERSIONING
    # Bài "upload đè vài lần, khôi phục bản cũ, hiểu delete marker".

    - name: "Versioning — ghi 3 phiên bản của version.txt"
      ansible.builtin.shell:
        cmd: >-
          echo "phien-ban-{{ item }} ghi luc $(date -Iseconds)" |
          aws s3 cp - s3://{{ tf.bucket_name }}/version.txt
          --profile {{ aws_profile }} --content-type text/plain
      loop: [2, 3, 4]
      changed_when: true
      tags: [versioning]

    - name: Liệt kê toàn bộ version
      ansible.builtin.command:
        argv:
          - aws
          - s3api
          - list-object-versions
          - "--profile={{ aws_profile }}"
          - "--bucket={{ tf.bucket_name }}"
          - "--prefix=version.txt"
          - "--query=Versions[].[VersionId,IsLatest,LastModified]"
          - --output=text
      register: ds_version
      changed_when: false
      tags: [versioning]

    - name: Các phiên bản đang tồn tại
      ansible.builtin.debug:
        msg: "{{ ds_version.stdout_lines }}"
      tags: [versioning]

    - name: "Xoá file — quan sát: nó KHÔNG thực sự biến mất"
      ansible.builtin.command:
        argv:
          - aws
          - s3api
          - delete-object
          - "--profile={{ aws_profile }}"
          - "--bucket={{ tf.bucket_name }}"
          - "--key=version.txt"
          - --query=VersionId
          - --output=text
      register: delete_marker
      changed_when: true
      tags: [versioning]

    - name: Delete marker vừa được tạo
      ansible.builtin.debug:
        msg:
          - "Bucket có bật versioning, nên lệnh delete KHÔNG xoá dữ liệu."
          - "Nó chỉ đặt lên trên cùng một 'delete marker': {{ delete_marker.stdout | trim }}"
          - "File biến mất khỏi danh sách, nhưng MỌI VERSION CŨ VẪN CÒN VÀ VẪN TÍNH TIỀN."
          - ""
          - "Đây là lý do 'xoá hết file rồi mà bucket vẫn không xoá được'."
          - "Muốn bucket thật sự trống phải xoá cả version lẫn delete marker."
      tags: [versioning]

    - name: Khôi phục bằng cách xoá delete marker
      ansible.builtin.command:
        argv:
          - aws
          - s3api
          - delete-object
          - "--profile={{ aws_profile }}"
          - "--bucket={{ tf.bucket_name }}"
          - "--key=version.txt"
          - "--version-id={{ delete_marker.stdout | trim }}"
      changed_when: true
      tags: [versioning]

    - name: Đọc lại file sau khi khôi phục
      ansible.builtin.command:
        argv:
          - aws
          - s3
          - cp
          - "s3://{{ tf.bucket_name }}/version.txt"
          - "-"
          - "--profile={{ aws_profile }}"
      register: sau_khoi_phuc
      changed_when: false
      tags: [versioning]

    - name: Đã khôi phục
      ansible.builtin.debug:
        msg: >-
          File trở lại: "{{ sau_khoi_phuc.stdout | trim }}".
          Khôi phục = xoá delete marker, không phải "undelete".
      tags: [versioning]

    # ================================================================= PRESIGNED
    #
    # Presigned URL cho phép người KHÔNG có tài khoản AWS truy cập một object
    # riêng tư, trong một khoảng thời gian giới hạn.
    #
    # Cơ chế: URL mang sẵn chữ ký tạo từ credential CỦA BẠN. Vì vậy nó chỉ có
    # được đúng những quyền mà bạn có, và hết hạn theo thời gian đã đặt.
    # Đây là đáp án chuẩn cho "cho phép tải file riêng tư mà không cần cấp IAM user".

    - name: Cấp presigned URL có hạn {{ presigned_ttl }} giây
      ansible.builtin.command:
        argv:
          - aws
          - s3
          - presign
          - "s3://{{ tf.bucket_name }}/version.txt"
          - "--expires-in={{ presigned_ttl }}"
          - "--profile={{ aws_profile }}"
      register: presigned
      changed_when: false
      tags: [presigned]

    - name: Presigned URL
      ansible.builtin.debug:
        msg:
          - "{{ presigned.stdout }}"
          - ""
          - "URL này sống {{ presigned_ttl }} giây. Thử ngay:"
          - "  curl -s '{{ presigned.stdout }}'"
          - "Đợi quá hạn rồi thử lại → AccessDenied kèm 'Request has expired'."
          - ""
          - "So sánh: gọi thẳng không có chữ ký thì bị chặn ngay:"
          - "  curl -s -o /dev/null -w '%{http_code}\\n' {{ tf.bucket_url }}"
      tags: [presigned]

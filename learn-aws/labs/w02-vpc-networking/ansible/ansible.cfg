[defaults]
inventory              = inventory/aws_ec2.yml
interpreter_python     = auto_silent
host_key_checking      = False
retry_files_enabled    = False
display_skipped_hosts  = False
callback_result_format = yaml

# Máy trong private subnet mất ~30-60 giây sau khi boot mới đăng ký được với SSM.
# Timeout rộng tay để playbook không hỏng chỉ vì bạn chạy quá sớm.
timeout = 60

[inventory]
# Bắt buộc bật plugin, nếu không file inventory/aws_ec2.yml sẽ bị bỏ qua
# và Ansible báo "inventory rỗng".
#
# Chỉ bật đúng plugin cần dùng. Nếu để thêm `yaml` ở đây, khi aws_ec2 trả về
# 0 máy thì Ansible sẽ thử parse tiếp bằng plugin yaml và in ra một cảnh báo
# gây hiểu nhầm ("not YAML inventory") che mất nguyên nhân thật.
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining = True
